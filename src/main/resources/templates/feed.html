<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Feed</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><section class="card"><h2>Create a post</h2><form action="/posts" method="post" enctype="multipart/form-data"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><textarea name="content" maxlength="2000" placeholder="What's happening?" required></textarea><label>Photo (optional)<input type="file" name="photo" accept="image/*"></label><button>Post</button></form></section><section><article class="card post" th:each="post:${posts}"><div class="post-head"><strong><a th:href="@{'/profile/'+${post.author.username}}" th:text="${post.author.username}"></a></strong><small th:text="${#temporals.format(post.createdAt,'dd MMM yyyy HH:mm')}"></small></div><p th:text="${post.content}"></p><img th:if="${post.photoUrl}" th:src="${post.photoUrl}" alt="Post photo"><form th:if="${post.author.username == #authentication.name}" th:action="@{'/posts/'+${post.id}+'/delete'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="danger">Delete</button></form></article></section></main></body></html>
