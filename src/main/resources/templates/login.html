<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Login</title><link rel="stylesheet" href="/css/app.css"></head><body class="auth"><main class="card auth-card"><h1>SocialSpring</h1><p>Sign in to your network.</p><div class="success" th:if="${param.registered}">Account created. You can sign in now.</div><div class="error" th:if="${param.error}">Invalid username or password.</div><form method="post" action="/login"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Username<input name="username" required></label><label>Password<input type="password" name="password" required></label><button>Sign in</button></form><p>New here? <a href="/register">Create account</a></p></main></body></html>
