<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Register</title><link rel="stylesheet" href="/css/app.css"></head><body class="auth"><main class="card auth-card"><h1>Create account</h1><div class="error" th:if="${error}" th:text="${error}"></div><form method="post" action="/register"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Username<input name="username" minlength="3" required></label><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button>Create account</button></form><a href="/login">Back to login</a></main></body></html>
