<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Profile</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><section class="card profile"><img class="avatar" th:src="${profile.avatarUrl != null && !profile.avatarUrl.isBlank() ? profile.avatarUrl : 'https://placehold.co/120x120?text=User'}"><div><h1 th:text="${profile.username}"></h1><p th:text="${profile.bio != null ? profile.bio : 'No bio yet.'}"></p></div></section><section class="card" th:if="${ownProfile}"><h2>Edit profile</h2><form method="post" action="/profile"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Bio<textarea name="bio" maxlength="500" th:text="${profile.bio}"></textarea></label><label>Avatar image URL<input name="avatarUrl" th:value="${profile.avatarUrl}"></label><button>Save profile</button></form></section><h2>Posts</h2><article class="card post" th:each="post:${posts}"><p th:text="${post.content}"></p><img th:if="${post.photoUrl}" th:src="${post.photoUrl}"></article></main></body></html>
