<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Admin</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><h1>Admin dashboard</h1><section class="card"><h2>Users</h2><table><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr><tr th:each="u:${users}"><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.role}"></td><td th:text="${u.enabled ? 'Enabled':'Disabled'}"></td><td><form th:action="@{'/admin/users/'+${u.id}+'/toggle'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Toggle</button></form></td></tr></table></section><section class="card"><h2>Content moderation</h2><article th:each="p:${posts}"><strong th:text="${p.author.username}"></strong><p th:text="${p.content}"></p><form th:action="@{'/admin/posts/'+${p.id}+'/delete'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="danger">Delete</button></form><hr></article></section></main></body></html>
