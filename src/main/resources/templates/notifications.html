<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Notifications</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><h1>Notifications</h1><article class="card" th:each="n:${notifications}"><p th:text="${n.message}"></p><small th:text="${#temporals.format(n.createdAt,'dd MMM HH:mm')}"></small><form th:if="${!n.readFlag}" th:action="@{'/notifications/'+${n.id}+'/read'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button>Mark read</button></form></article><p th:if="${#lists.isEmpty(notifications)}">No notifications yet.</p></main></body></html>
