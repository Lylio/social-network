<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><title>Messages</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container grid"><aside class="card"><h2>People</h2><a class="person" th:each="p:${people}" th:href="@{/messages(with=${p.username})}" th:text="${p.username}"></a></aside><section class="card"><h2 th:text="${with != null ? 'Chat with '+with : 'Choose someone to message'}"></h2><div id="messages" class="messages"><div th:each="m:${history}" class="message" th:classappend="${m.sender == #authentication.name ? ' mine' : ''}"><strong th:text="${m.sender}"></strong><span th:text="${m.content}"></span></div></div><form th:if="${with != null}" id="chatForm"><input id="messageInput" autocomplete="off" placeholder="Type a message..." required><button>Send</button></form></section></main><meta name="csrf-token" th:content="${_csrf.token}"><script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script><script th:inline="javascript">const recipient=/*[[${with}]]*/ null;const currentUser=/*[[${#authentication.name}]]*/'';</script><script src="/js/chat.js"></script></body></html>
